[workspace]
resolver = "2"
members = ["crates/smars-protocol", "crates/smars-core", "crates/smars_esp32c3"]
# host 上只默认测试纯 Rust crate；固件 crate 仅用 Espressif 工具链按目标构建（README）
default-members = ["crates/smars-protocol", "crates/smars-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = ""

[workspace.dependencies]
smars-protocol = { path = "crates/smars-protocol" }

# esp-idf-svc 0.53 原版引用 ESP-IDF 5.4+ 的 wifi_event_neighbor_report_t.n_report 字段，
# 与钉住的 ESP-IDF 5.3.2（字段名 report）不符；vendored 副本仅改此一行，见 lib/esp-idf-svc。
[patch.crates-io]
esp-idf-svc = { path = "lib/esp-idf-svc" }

[profile.release]
opt-level = "s"
lto = true
