[package]
name = "smars-esp32c3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SMARS 小车主控固件：WiFi 网页遥控 + STC8H1K08 八路 PWM"
publish = false

[[bin]]
name = "smars-esp32c3"
path = "src/main.rs"
harness = false # 不用内置 cargo test 测试框架（嵌入式目标）

# 目标: riscv32imc-esp-espidf（ESP32-C3, std / esp-idf-svc）
# host 上仅可解析依赖，无法编译；构建方法见 README.md。
[dependencies]
esp-idf-svc = "0.53"
esp-idf-sys = "0.38"
# rmt-legacy：WS2812 用 FixedLengthSignal/legacy TxRmtDriver（新 RMT API 需自定义编码器）
# adc-oneshot-legacy：一次性 ADC（示例代码使用的稳定 API）
esp-idf-hal = { version = "0.47", features = ["rmt-legacy", "adc-oneshot-legacy"] }
anyhow = "1"
log = "0.4"
serde_json = "1"
smars-protocol = { workspace = true }
smars-core = { path = "../smars-core" }

[build-dependencies]
# 转发 esp-idf-sys（links="esp_idf"）传播的链接参数到最终链接，见 build.rs
embuild = "0.33.5"

[features]
# 机器人 feature：恰好启用一个（NAME/配置矩阵由此确定），见 docs/design.md §8
robot-bolt = []
robot-fork = []
robot-cargo = []
robot-lift = []
robot-scan = []
robot-truck = []
# 可选外设特性（与 robot-* 叠加）
buzz = []     # 蜂鸣器：开机旋律 + 网页喇叭按钮
ws2812 = []   # WS2812 灯带（WS2812_COUNT 颗）：开关 + 网页效果控制
