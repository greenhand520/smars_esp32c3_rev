; STC8H1K08 8-channel PWM controller (SDCC + FwLib_STC8)
;
; Board: no STC8H1K08 manifest exists in the intel_mcs51 platform, so the
; STC8H1K28 manifest is used with explicit STC8H1K08 overrides (8K code / 1K XRAM).
;
; System clock: IRC is trimmed to board_build.f_cpu at ISP upload (stcgal -t);
; firmware never writes the IRC trim registers, so __CONF_FOSC MUST equal f_cpu.

[env:stc8h1k08]
platform = intel_mcs51
board = STC8H1K28

board_build.mcu = stc8h1k08
board_build.f_cpu = 22118400L
board_build.size_iram = 256
board_build.size_xram = 1024
board_build.size_code = 8192
board_build.size_heap = 64

board_upload.maximum_size = 8192
board_upload.maximum_ram_size = 1280

build_flags =
    -D__CONF_FOSC=22118400UL
    -D__CONF_MCU_MODEL=MCU_MODEL_STC8H1K08
